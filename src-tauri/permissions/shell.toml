# The client's own commands, for its own window.
#
# Having any file in `permissions/` switches Tauri to checking every app
# command against a permission - and until this file existed none were listed,
# so every call the shell made (library, downloads, settings, even the Store's
# own `catalog_url`) was refused with "Command not found". Every command in
# `generate_handler!` in `src/lib.rs` must appear here; `lib.rs` has a test
# that fails when one is missing.

[[permission]]
identifier = "allow-shell"
description = "Everything the desktop shell calls: the Store view, the library, games, downloads and settings."
commands.allow = [
  "repair_sources", "repair_state", "repair_apply", "repair_undo", "repair_support", "repair_support_url",
  "take_pending_link",
  "display_rendered",
  "game_logs",
  "game_log_read",
  "game_logs_folder",
  "library_prefix_folder",
  "pad_start",
  "shell_theme",
  "phone_status", "phone_set_lan", "phone_new_code", "phone_revoke", "phone_report_look",
  "cloud_achievements_status",
  "cloud_saves_status", "cloud_saves_refresh", "cloud_saves_game", "cloud_saves_location", "cloud_saves_leave_out", "cloud_saves_add_folder",
  "cloud_saves_backup", "cloud_saves_versions", "cloud_saves_restore", "cloud_saves_restore_local", "cloud_saves_answer",
  "cloud_saves_library", "cloud_saves_find_precisely",
  "runtimes_list", "runtimes_install", "runtimes_progress", "runtimes_cancel", "runtimes_clear_cache",
  "pad_stop",
  "pad_list",
  "pad_config_get",
