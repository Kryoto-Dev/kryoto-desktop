[package]
name = "kryoto-saves"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Finding where a game keeps its saves, packing them into a cloud backup and putting them back."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
